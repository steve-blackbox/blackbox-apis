<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlackBox Automated Control — 100 Core API Fleet</title>
    <style>
        :root {
            --bg-base: #020308;
            --bg-sidebar: rgba(4, 6, 15, 0.85);
            --bg-card: rgba(6, 12, 22, 0.65);
            --border-glow: #14281a;
            --border-active: #00ff88;
            --text-main: #e2fbe9; /* Vert menthe glacé ultra-pâle premium */
            --text-muted: #385340; /* Vert sombre militarisé de soute */
            --accent-green: #00ff88; /* Vert émeraude laser Matrix */
            --sidebar-width: 310px;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 0; display: flex !important; flex-direction: row !important;
            height: 100vh; overflow: hidden; box-sizing: border-box;
        }

        /* 🌌 BACKGROUND MATRIX DYNAMIQUE FLUO */
        #matrixCanvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; opacity: 0.14; pointer-events: none;
        }

        /* 📐 SIDEBAR EXECUTIVE SANS COUTURES (STYLE LINEAR NATIVE) */
        aside {
            width: var(--sidebar-width) !important; min-width: var(--sidebar-width) !important; max-width: var(--sidebar-width) !important;
            background-color: var(--bg-sidebar); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border-right: 1px solid var(--border-glow); display: flex !important; flex-direction: column !important;
            height: 100vh !important; box-shadow: 20px 0 60px rgba(0, 0, 0, 0.9); z-index: 50; box-sizing: border-box;
        }

        .sidebar-header {
            padding: 32px 24px; border-bottom: 1px solid var(--border-glow);
            background: linear-gradient(to bottom, rgba(3,8,5,0.4), transparent);
            display: flex; align-items: center; gap: 12px;
        }
        .linear-logo-container {
            width: 32px; height: 32px; min-width: 32px;
            display: flex; align-items: center; justify-content: center;
        }

        .sidebar-title { 
            font-size: 18px; font-weight: 900; margin: 0; letter-spacing: -0.5px; 
            color: #ffffff; text-shadow: 0 0 15px rgba(255,255,255,0.1);
        }

        .theme-list { flex: 1; overflow-y: auto; padding: 24px 12px; }
        .theme-list::-webkit-scrollbar { width: 3px; }
        .theme-list::-webkit-scrollbar-thumb { background: var(--border-glow); border-radius: 2px; }

        .theme-btn {
            width: 100%; background: transparent; border: none; color: var(--text-muted);
            padding: 14px 16px; text-align: left; font-size: 14px; cursor: pointer;
            outline: none; border-radius: 8px; margin-bottom: 4px; display: flex; flex-direction: column;
            box-sizing: border-box; transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .theme-btn:hover { background-color: rgba(0, 255, 136, 0.03); color: var(--text-main); }
        .theme-btn.active {
            background: linear-gradient(90deg, rgba(0, 255, 136, 0.05) 0%, transparent 100%);
            color: #ffffff !important; font-weight: 700; border-left: 3px solid var(--accent-green); padding-left: 20px;
        }

        main {
            flex: 1 !important; padding: 50px; overflow-y: auto; box-sizing: border-box; z-index: 10;
            background: radial-gradient(circle at top right, rgba(0,255,136,0.04), transparent 60%);
        }

        main::-webkit-scrollbar { width: 3px; }
        main::-webkit-scrollbar-thumb { background: var(--border-glow); }
        .content-container { max-width: 950px; width: 100%; margin: 0 auto; }

        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-glow); padding-bottom: 24px; margin-bottom: 40px; }
        h1 {
            font-size: 24px; font-weight: 900; color: #ffffff; margin: 0; text-transform: uppercase; letter-spacing: -0.5px;
            background: linear-gradient(to right, #ffffff 50%, var(--text-main)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .robots-nav { display: flex; gap: 12px; margin-bottom: 40px; border-bottom: 1px solid var(--border-glow); padding-bottom: 20px; overflow-x: auto; }
        .robot-tab {
            background: rgba(0, 255, 136, 0.01); border: 1px solid var(--border-glow); color: var(--text-muted);
            padding: 12px 24px; text-align: center; font-size: 12px; font-family: monospace; cursor: pointer;
            border-radius: 8px; outline: none; white-space: nowrap; transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .robot-tab:hover { border-color: rgba(0, 255, 136, 0.3); color: var(--text-main); background: rgba(0, 255, 136, 0.02); }
        .robot-tab.active { background: rgba(0, 255, 136, 0.04); border-color: var(--accent-green); color: var(--accent-green); font-weight: 700; box-shadow: 0 0 25px rgba(0, 255, 136, 0.2); }

        .robot-main-title { font-size: 42px; font-weight: 900; color: #ffffff; margin: 0 0 24px 0; line-height: 1.15; letter-spacing: -1.5px; text-shadow: 0 0 20px rgba(255,255,255,0.05); }
        .robot-main-desc { font-size: 16px; color: #8fa394; line-height: 1.6; margin-bottom: 45px; max-width: 780px; }

        .bento-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 50px; }
        .bento-card {
            background-color: var(--bg-card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border-glow); padding: 30px; border-radius: 14px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5); transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .bento-card:hover { border-color: rgba(0, 255, 136, 0.3); box-shadow: 0 0 30px rgba(0, 255, 136, 0.05); transform: translateY(-2px); }
        .bento-card h3 { font-size: 13px; font-weight: 700; color: #ffffff; margin: 0 0 14px 0; text-transform: uppercase; font-family: monospace; letter-spacing: 0.5px; display: flex; align-items: center; gap: 10px; }
        .bento-card h3 span { color: var(--accent-green); text-shadow: 0 0 10px var(--accent-green); }
        .bento-card p { font-size: 13px; color: #8fa394; margin: 0; line-height: 1.6; }
.stripe-section { border-top: 1px solid var(--border-glow); padding-top: 40px; }
        .stripe-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }
        
        .plan-box {
            background: linear-gradient(135deg, rgba(4,8,6,0.8) 0%, rgba(2,4,3,0.9) 100%); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border-glow); padding: 28px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .plan-box:hover { border-color: rgba(0, 255, 136, 0.4); box-shadow: 0 0 30px rgba(0, 255, 136, 0.08); }
        .plan-info { display: flex; flex-direction: column; max-width: 65%; }
        .plan-name { font-size: 15px; font-weight: 700; color: #ffffff; margin-bottom: 4px; text-transform: uppercase; font-family: monospace; letter-spacing: 0.5px; }
        .plan-desc { font-size: 11px; color: #8fa394; line-height: 1.4; margin-bottom: 4px; font-weight: 500; }
        .plan-target-audience { font-size: 11px; color: var(--accent-green); font-family: monospace; opacity: 0.8; }
        .plan-action { display: flex; align-items: center; gap: 24px; }
        .plan-price-wrapper { display: flex; flex-direction: column; align-items: flex-end; }
        .plan-price { font-size: 24px; font-weight: 900; color: var(--accent-green); font-family: monospace; text-shadow: 0 0 10px rgba(0,255,136,0.3); }
        .plan-term { font-size: 9px; color: var(--text-muted); font-family: monospace; text-transform: uppercase; letter-spacing: 0.5px; margin-top: -2px; }

        .buy-btn {
            background-color: transparent; color: var(--accent-green); border: 1px solid rgba(0, 255, 136, 0.4);
            padding: 12px 24px; font-size: 11px; font-weight: 800; border-radius: 6px; cursor: pointer;
            text-transform: uppercase; font-family: monospace; outline: none; transition: all 0.2s ease;
        }
        .buy-btn:hover { background-color: rgba(0, 255, 136, 0.05); border-color: var(--accent-green); transform: scale(1.02); }
        .buy-btn.laser-btn {
            background-color: var(--accent-green); color: #000000; border: none; font-weight: 900;
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.35);
        }
        .buy-btn.laser-btn:hover { background-color: #00e676; box-shadow: 0 0 35px rgba(0, 255, 136, 0.5); }
    </style>
</head>
<body>

    <canvas id="matrixCanvas"></canvas>

    <aside>
        <div class="sidebar-header">
            <div class="linear-logo-container">
                <svg width="28" height="28" viewBox="0 0 100 100" style="filter: drop-shadow(0 0 8px rgba(0, 255, 136, 0.3));">
                    <circle cx="50" cy="50" r="46" fill="#020308" stroke="#14281a" stroke-width="4"/>
                    <path d="M25,75 L75,25 M35,80 L80,35 M20,65 L65,20" stroke="#00ff88" stroke-width="6" stroke-linecap="round"/>
                    <path d="M45,85 L85,45 M15,50 L50,15" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
                </svg>
            </div>
            <div class="sidebar-title">BLACKBOX LABS</div>
        </div>
        <div class="theme-list sidebar-scroll" id="sidebar-categories"></div>
    </aside>

    <script>
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        const columns = Math.floor(width / 24);
        const yPositions = Array(columns).fill(0);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(2, 3, 8, 0.06)';
            ctx.fillRect(0, 0, width, height);
            ctx.fillStyle = '#00ff88';
            ctx.font = '11px monospace';
            yPositions.forEach((y, index) => {
                const text = String.fromCharCode(33 + Math.random() * 93);
                ctx.fillText(text, index * 24, y);
                if (y > 100 + Math.random() * 15000) yPositions[index] = 0;
                else yPositions[index] = y + 13;
            });
        }
        setInterval(drawMatrix, 33);
        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const categoriesDatabase = [
            { id: "div01", name: "Form & Data Protection" },
            { id: "div02", name: "Cyber-Defense Modules" },
            { id: "div03", name: "Privacy & Cloud Proxy" },
            { id: "div04", name: "Audio Processing Lab" },
            { id: "div05", name: "Media & Asset Optimizer" },
            { id: "div06", name: "Document Automation" },
            { id: "div07", name: "Geoloc & Smart Routing" },
            { id: "div08", name: "Agent Web Analytics" },
            { id: "div09", name: "Web Scraping Matrix" },
            { id: "div10", name: "Code & Performance Core" },
            { id: "div11", name: "Automated Task Scheduling" },
            { id: "div12", name: "SEO Keyword Optimizer" },
            { id: "div13", name: "Link Protection & Cloaking" },
            { id: "div14", name: "Fintech & Currency Utilities" },
            { id: "div15", name: "Crypto Security Gateways" },
            { id: "div16", name: "Symmetric Encryption Nets" },
            { id: "div17", name: "Dynamic Case Compilers" },
            { id: "div18", name: "System Health Diagnostics" },
            { id: "div19", name: "Log Sanitizers & Privacy" },
            { id: "div20", name: "Multi-Cloud Traffic Flow" }
        ];

        const matrixEcosystem = {};
        
        // 🚀 LE CORRECTIF PHARE : Génération de noms de robots uniques par secteur pour briser la stagnation visuelle
        categoriesDatabase.forEach((cat, catIndex) => {
            const prefix = cat.name.split(' ')[0]; // Récupère le premier mot de la catégorie (ex: Form, Cyber, Privacy...)
            matrixEcosystem[cat.id] = {
                name: cat.name,
                robots: [
                    { id: `rb_${cat.id}_1`, name: `${prefix} Shield Alpha`, title: `Sanitize System Access Ingress.<br>Block Spam Upstream Silently.`, desc: `Stateless endpoint validation engine engineered to filter automated payload injections and scraping scripts under microsecond transaction windows before variable storage hydration.`, t1: "SURGICAL SCRUB", d1: "Strips toxic script headers and event triggers natively inside volatile runtime slots.", t2: "STATELESS INGESTION", d2: "Processes input tokens cleanly without creating tracking files or system caching footprint loops.", endpoint: `/v1/shield-node-${catIndex + 1}` },
                    { id: `rb_${cat.id}_2`, name: `${prefix} Inspector Beta`, title: `Real-Time Payload Audit.<br>Deep Structural JSON Validation.`, desc: "Monitors input data validation templates at the perimeter gateway layer to neutralize malformed signatures and object chaining exploits natively.", t1: "SYNTAX PROTECTION", d1: "Scans structured text trees to bypass malicious prototype pollution or hijacking attempts.", t2: "SUB-0.03MS LATENCY", d2: "Designed to run at the perimeter edge under strict enterprise-grade performance benchmarks.", endpoint: `/v1/inspect-core-${catIndex + 1}` },
                    { id: `rb_${cat.id}_3`, name: `${prefix} Secure Proxy`, title: `Ephemeral Network Routing.<br>Encapsulated Content Routing Net.`, desc: "Hardened proxy namespacing layer routing external API callback streams safely across volatile pools to prevent behavioral matching maps.", t1: "PATTERN DISRUPTION", d1: "Blocks system tracking footprints and reverse origin profiling attempts automatically in flight.", t2: "ABSOLUTE HYGIENE", d2: "Enforces total context sandbox isolation to guarantee cross-tenant boundaries remain sterile.", endpoint: `/v1/proxy-slot-${catIndex + 1}` },
                    { id: `rb_${cat.id}_4`, name: `${prefix} Compactor Core`, title: `Whitespace Space Compactor.<br>String Sanitization Protocol.`, desc: "Locates and crushes multiple layout indentation tabs, carriage returns and redundant special signs into uniform alphanumeric string blocks.", t1: "DATA REDUCTION", d1: "Reduces raw payload weights significantly up to 60% before heavy database ingestion loops.", t2: "MEMORY DEFENSE", d2: "Operates 100% in local volatile registers, protecting active hardware from memory bloat leaks.", endpoint: `/v1/compactor-core-${catIndex + 1}` },
                    { id: `rb_${cat.id}_5`, name: `${prefix} Token Master`, title: `Master Cryptographic Token.<br>High-Entropy Seed Scrambler.`, desc: "Generates ephemeral cryptographically secure access keys utilizing randomized multi-seeded parameter loops for top-tier microservice maillage.", t1: "HIGH ENTROPY MATRIX", d1: "Utilizes advanced low-level hardware structures to forge unique authentication signatures on the fly.", t2: "INSTANT INVALIDATION", d2: "Destroys cryptographic tracking flags immediately upon transit processing completion at the gateway edge.", endpoint: `/v1/master-token-${catIndex + 1}` }
                ]
            };
        });
        let currentDivisionId = "div01";
        let activeRobotIndex = 0;

        function renderSubNavigation() {
            const subnavContainer = document.getElementById('robots-subnav');
            if (!subnavContainer) return;
            subnavContainer.innerHTML = '';
            
            const activeGroup = matrixEcosystem[currentDivisionId];
            const robotsList = activeGroup ? activeGroup.robots : [];
            
            robotsList.forEach((robot, index) => {
                const btn = document.createElement('button');
                // 🚀 DESTRUCTEUR DE CACHE : ID indexé sur la division active pour forcer la mutation visuelle
                btn.id = `tab-robot-${currentDivisionId}-${index}`;
                btn.className = `robot-tab ${index === activeRobotIndex ? 'active' : ''}`;
                btn.innerText = robot.name; // 🟢 FORCE l'écriture du nom unique généré par le préfixe de soute !
                btn.onclick = () => {
                    activeRobotIndex = index;
                    document.querySelectorAll('.robot-tab').forEach(t => t.classList.remove('active'));
                    btn.classList.add('active');
                    loadRobotData();
                };
                subnavContainer.appendChild(btn);
            });
        }

        function switchDivision(divisionId) {
            currentDivisionId = divisionId;
            activeRobotIndex = 0; // Réinitialise proprement sur le premier robot du thème sélectionné
            
            document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-theme-${divisionId}`);
            if (activeBtn) activeBtn.classList.add('active');
            
            const mainHeaderTitle = document.getElementById('current-division-title');
            if (mainHeaderTitle && activeBtn) {
                mainHeaderTitle.innerText = activeBtn.innerText;
            }
            
            // 🚀 RÉACTIVITÉ COMPLÈTE : Force le recalcul horizontal et l'affichage instantané des nouveaux textes
            renderSubNavigation();
            loadRobotData();
        }

        function loadRobotData() {
            const activeGroup = matrixEcosystem[currentDivisionId];
            const robotsList = activeGroup ? activeGroup.robots : [];
            if (robotsList.length === 0) return;
            const robot = robotsList[activeRobotIndex];

            document.getElementById('robot-main-title').innerHTML = robot.title;
            document.getElementById('robot-main-desc').textContent = robot.desc;
            
            document.getElementById('feature-title-1').innerHTML = `<span>✦</span> ` + robot.t1;
            document.getElementById('feature-desc-1').textContent = robot.d1;
            document.getElementById('feature-title-2').innerHTML = `<span>✦</span> ` + robot.t2;
            document.getElementById('feature-desc-2').textContent = robot.d2;
            
            const targetTag = document.getElementById('gateway-target-tag');
            if (targetTag) targetTag.textContent = robot.endpoint;
            
            document.getElementById('price-solo-tag').textContent = "49$";
            document.getElementById('price-agency-tag').textContent = "149$";
        }

        async function triggerCheckout(planType) {
            const activeGroup = matrixEcosystem[currentDivisionId];
            const robot = activeGroup ? activeGroup.robots[activeRobotIndex] : null;
            if (!robot) return;
            try {
                const response = await fetch('/v1/checkout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ plan: planType, endpoint_target: robot.endpoint })
                });
                const session = await response.json();
                if (session.url) window.location.href = session.url;
                else alert(`Stripe Error: ${session.error}`);
            } catch (err) {
                alert(`Network failure: ${err.message}`);
            }
        }

        function initializeApp() {
            const sidebarContainer = document.getElementById('sidebar-categories');
            sidebarContainer.innerHTML = '';
            categoriesDatabase.forEach((cat, index) => {
                const btn = document.createElement('button');
                btn.id = `btn-theme-${cat.id}`;
                btn.className = `theme-btn ${cat.id === currentDivisionId ? 'active' : ''}`;
                btn.innerHTML = cat.name;
                btn.onclick = () => switchDivision(cat.id);
                sidebarContainer.appendChild(btn);
            });
            currentDivisionId = "div01";
            activeRobotIndex = 0;
            renderSubNavigation();
            loadRobotData();
        }

        window.onload = initializeApp;
    </script>
</body>
</html>
