<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlackBox Automated Control — API Production Fleet</title>
    <style>
        /* CSS PUR INTERNE — GARANTI ZERO BUG DE CHARGEMENT RESEAU EXTERNE */
        body {
            background-color: #030712;
            color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 650px;
            background-color: #0b1329;
            border: 2px solid #1e293b;
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            position: relative;
        }
        .brand {
            font-size: 11px;
            font-weight: bold;
            color: #475569;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 30px;
            font-weight: 800;
            color: #ffffff;
            margin: 0 0 16px 0;
            letter-spacing: -0.5px;
        }
        .subtitle {
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.6;
            max-width: 440px;
            margin: 0 auto 32px auto;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: #10b981;
            padding: 12px 24px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            font-family: monospace;
            letter-spacing: 1px;
        }
        .badge-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <!-- 🛡️ LA COQUE MONOLITHE CENTRÉE RE-SOUDÉE EN CSS NATIF PUR -->
    <div class="container">
        <!-- LOGO ET SIGNATURE -->
        <div class="brand">B L A C K B O X</div>
        
        <!-- LE TITRE CLASSE ET MAJESTUEUX -->
        <h1>BlackBox Automated Control</h1>
        
        <!-- DESCRIPTION RE-SOUDÉE EN TEXTE CLAIR ET LISIBLE -->
        <div class="subtitle">Monolithe d'infrastructure cloud active souveraine. Les serveurs de sôute répondent au bit près.</div>
        
        <!-- LE COMPTEUR ÉMERAUDE COMPLIANT DE 16H45 -->
        <div class="badge">
            <div class="badge-dot"></div>
            100 Robots de Feu &bull; Production Live
        </div>
    </div>

</body>
</html>
