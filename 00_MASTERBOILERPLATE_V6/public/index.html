<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlackBox Automated Control — API Production Fleet</title>
    <script src="https://tailwindcss.com"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #030712;
        }
        .font-display {
            font-family: 'Space Grotesk', sans-serif;
        }
        .font-code {
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>
<body class="text-gray-100 min-h-screen flex items-center justify-center p-4 antialiased">

    <!-- 🛡️ BOÎTE DE SÔUTE MONOLITHE HISTORIQUE -->
    <div class="w-full max-w-2xl bg-gray-950 border-2 border-gray-900 rounded-3xl p-10 text-center shadow-2xl relative overflow-hidden">
        <div class="absolute -top-24 -left-24 w-48 h-48 bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-emerald-600/10 rounded-full blur-3xl pointer-events-none"></div>
        
        <!-- SIGNATURE D'ARMEMENT -->
        <div class="font-display font-bold text-gray-400 text-sm tracking-widest uppercase mb-6 flex items-center justify-center gap-2">
            <span class="w-2 h-2 bg-blue-600 rounded-full"></span> B L A C K B O X
        </div>

        <h1 class="text-4xl font-extrabold font-display tracking-tight text-white mb-4">
            BlackBox Automated Control
        </h1>
        
        <p class="text-sm text-gray-300 font-normal leading-relaxed max-w-md mx-auto mb-8">
            Monolithe d'infrastructure cloud active souveraine. Les serveurs de sôute répondent au bit près.
        </p>

        <!-- DISPOSITIF DU COMPTEUR -->
        <div class="inline-flex items-center gap-2 bg-emerald-500/10 border-2 border-emerald-500/20 text-emerald-400 px-6 py-3 rounded-full text-xs font-bold font-code tracking-wider uppercase">
            <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span>
            100 Robots de Feu &bull; Production Live
        </div>
    </div>

</body>
</html>
