<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlackBox Automated Control — 100 API Master Fleet</title>
    <script src="https://tailwindcss.com"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #030712; }
        .font-display { font-family: 'Space Grotesk', sans-serif; }
        .font-code { font-family: 'JetBrains Mono', monospace; }
        .bento-card { transition: all 0.2s ease-in-out; }
        .bento-card:hover { border-color: rgba(59, 130, 246, 0.4); box-shadow: 0 0 25px -5px rgba(59, 130, 246, 0.2); }
    </style>
</head>
<body class="text-gray-100 min-h-screen antialiased">

    <!-- HEADER PREMIUM DESIGN -->
    <header class="border-b border-gray-800/60 bg-gray-950/80 backdrop-blur-md sticky top-0 z-50 px-6 py-4">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center font-display font-bold text-white shadow-lg shadow-blue-500/20">B</div>
                <div>
                    <h1 class="text-lg font-bold font-display tracking-tight text-white flex items-center gap-2">
                        BlackBox Automated Control <span class="text-xs bg-blue-500/10 text-blue-400 border border-blue-500/20 px-2.5 py-0.5 rounded-full font-code">100 Core APIs</span>
                    </h1>
                    <p class="text-xs text-gray-400">Stateless Architecture Matrix &bull; Enterprise Grade</p>
                </div>
            </div>
            
            <div class="flex items-center gap-4 w-full md:w-auto">
                <div class="bg-gray-900 border border-gray-800 rounded-xl p-1.5 flex items-center w-full md:w-96">
                    <span class="text-gray-500 px-3 font-code text-xs font-bold uppercase tracking-wider">Gateway:</span>
                    <input type="text" id="targetUrl" value="https://onrender.com" class="bg-transparent border-0 text-emerald-400 font-code text-xs focus:ring-0 w-full outline-none py-0.5 animate-pulse">
                </div>
                <div class="flex items-center gap-2 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 px-3 py-2 rounded-xl text-xs font-semibold shadow-sm">
                    <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span>
                    Production Live
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-10 space-y-12">
        
        <!-- INTERFACE TERMINAL -->
        <section class="bg-gray-950 border border-gray-800/80 rounded-3xl p-6 shadow-2xl relative overflow-hidden bento-card">
            <div class="absolute top-0 right-0 w-96 h-96 bg-blue-500/5 rounded-full blur-3xl pointer-events-none"></div>
            
            <div class="flex items-center gap-2 mb-6 border-b border-gray-800 pb-4">
                <span class="w-3 h-3 rounded-full bg-red-500/80"></span>
                <span class="w-3 h-3 rounded-full bg-yellow-500/80"></span>
                <span class="w-3 h-3 rounded-full bg-emerald-500/80"></span>
                <span class="text-xs font-code text-gray-400 ml-2">// EXECUTION ENGINE TERMINAL</span>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                <div class="lg:col-span-5 space-y-5">
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-2 uppercase tracking-wider">Sélectionner un Automate</label>
                        <select id="routeSelect" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-3 py-3 text-sm text-white font-medium focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none">
                            <option value="/v1/secure-id-scrambler" selected>[Node-100] /v1/secure-id-scrambler (Master Token)</option>
                            <option value="/v1/word-inverter">[Node-99] /v1/word-inverter</option>
                            <option value="/v1/special-char-stripper">[Node-98] /v1/special-char-stripper</option>
                            <option value="/v1/space-collapser">[Node-97] /v1/space-collapser</option>
                            <option value="/v1/sentence-capitalizer">[Node-96] /v1/sentence-capitalizer</option>
                            <option value="/v1/form-shield">[Node-01] /v1/form-shield</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-2 uppercase tracking-wider">Payload d'entrée JSON</label>
                        <textarea id="payloadInput" class="w-full h-36 bg-gray-900/60 border border-gray-800 rounded-xl p-3 text-xs font-code text-emerald-400 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none shadow-inner">{"seed_prefix": "BB_MASTER", "internal_identifier": "100"}</textarea>
                    </div>
                    <button onclick="executePayload()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white text-xs font-bold py-3.5 rounded-xl transition-all duration-200 shadow-lg shadow-blue-500/10 tracking-widest uppercase active:scale-[0.99]">
                        EXPULSER LE FLUX DANS LA MATRIX
                    </button>
                </div>
                
                <div class="lg:col-span-7 flex flex-col">
                    <label class="block text-xs font-semibold text-gray-400 mb-2 uppercase tracking-wider">Retour d'infrastructure serveur</label>
                    <div id="responseOutput" class="w-full flex-1 min-h-[260px] bg-gray-900/40 border border-gray-800/80 rounded-xl p-4 font-code text-xs text-gray-300 overflow-y-auto max-h-[280px] whitespace-pre-wrap shadow-inner border border-gray-800">[ READY ] En attente d'ingestion applicative sterile...</div>
                </div>
            </div>
        </section>
    </main>
    <footer class="border-t border-gray-900 bg-gray-950/40 py-8 text-center text-xs text-gray-500 font-code">
        &copy; 2026 BlackBox Audio Labs LLC. Systems Sterile. All Rights Reserved Sovereign Engine.
    </footer>

    <script>
        // Ingestion dynamique des structures JSON sous forme d'objets stérile
        const payloads = {
            "/v1/secure-id-scrambler": '{"seed_prefix": "BB_MASTER", "internal_identifier": "100"}',
            "/v1/word-inverter": '{"raw_text_stream": "BlackBox Sovereign Engine", "invert_mode": "characters"}',
            "/v1/special-char-stripper": '{"raw_dirty_string": "Hello Steve! Purge 100% des emojis !!!", "allow_spaces": true}',
            "/v1/space-collapser": '{"raw_text_stream": "Texte compresse sans espaces multiples."}',
            "/v1/sentence-capitalizer": '{"raw_text_stream": "bonjour steve. le code v42 est en ligne."}',
            "/v1/form-shield": '{"raw_input_string": "Hello Steve!"}'
        };

        document.getElementById('routeSelect').addEventListener('change', function(e) {
            const r = e.target.value;
            if (payloads[r]) {
                document.getElementById('payloadInput').value = payloads[r];
            }
        });

        async function executePayload() {
            const baseUrl = document.getElementById('targetUrl').value.trim();
            const route = document.getElementById('routeSelect').value;
            const payloadRaw = document.getElementById('payloadInput').value.trim();
            const box = document.getElementById('responseOutput');

            box.textContent = "[ LOADING ] Expulsion du flux vers les serveurs US...";
            box.style.color = "#3b82f6";
            
            try {
                // Parse et stringify immédiat pour garantir l'absence de friture ou d'illégalité de format
                const parsedJson = JSON.parse(payloadRaw);

                const response = await fetch(`${baseUrl}${route}`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(parsedJson)
                });

                const data = await response.json();
                box.textContent = JSON.stringify(data, null, 2);
                box.style.color = response.ok ? "#10b981" : "#ef4444";
            } catch (err) {
                box.textContent = `[❌ CRASH PARSER/NET] Erreur d'analyse ou de transmission.\nDetails : ${err.message}\n\nAssurez-vous que le format entré est un JSON valide sans sauts de ligne texte bruts.`;
                box.style.color = "#ef4444";
            }
        }
    </script>
</body>
</html>
