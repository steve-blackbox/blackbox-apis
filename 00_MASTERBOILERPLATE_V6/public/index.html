<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlackBox Automated Control — API Production Fleet</title>
    <style>
        body {
            background-color: #030712;
            color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #0b0f19;
            border: 2px solid #1f2937;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #ffffff;
        }
        p {
            font-size: 14px;
            color: #9ca3af;
            margin-bottom: 30px;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: #10b981;
            padding: 8px 16px;
            border-radius: 9999px;
            font-family: monospace;
            font-size: 13px;
            font-weight: bold;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>BlackBox Automated Control</h1>
        <p>Monolithe d'infrastructure cloud active souveraine. Les serveurs de sôute répondent au bit près.</p>
        <div class="status-badge">
            <span class="status-dot"></span>
            100 ROBOTS DE FEU • PRODUCTION LIVE
        </div>
    </div>
</body>
</html>
