<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlackBox Automated Control — API Production Fleet</title>
    <style>
        /* CSS PUR TOTALEMENT INDÉPENDANT — AUCUN RISQUE DE NOIR SUR NOIR */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #030712;
            color: #f3f4f6;
            min-height: screen;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            background-radial: radial-gradient(circle at top, #1e1b4b, #030712);
        }
        .container {
            width: 100%;
            max-width: 600px;
            background-color: #0b0f19;
            border: 2px solid #1f2937;
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
        }
        .brand-tag {
            font-family: "Space Grotesk", sans-serif;
            font-weight: 700;
            color: #4b5563;
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .brand-dot {
            width: 8px;
            height: 8px;
            background-color: #2563eb;
            border-radius: 50%;
        }
        h1 {
            font-size: 32px;
            font-weight: 800;
            color: #ffffff;
            margin: 0 0 16px 0;
            letter-spacing: -0.5px;
        }
        p {
            font-size: 14px;
            color: #9ca3af;
            line-height: 1.6;
            max-width: 440px;
            margin: 0 auto 32px auto;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: rgba(16, 185, 129, 0.1);
            border: 2px solid rgba(16, 185, 129, 0.2);
            color: #34d399;
            padding: 12px 24px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 700;
            font-family: monospace;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="brand-tag">
            <span class="brand-dot"></span> B L A C K B O X
        </div>

        <h1>BlackBox Automated Control</h1>
        
        <p>Monolithe d'infrastructure cloud active souveraine. Les serveurs de sôute répondent au bit près.</p>

        <div class="status-badge">
            <span class="status-dot"></span>
            100 Robots de Feu &bull; Production Live
        </div>
    </div>

</body>
</html>
