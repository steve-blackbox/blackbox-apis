<svg xmlns="http://w3.org" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- 🕶️ CORE BLACKBOX SHIELD background -->
  <rect width="512" height="512" rx="110" fill="#03050d" stroke="#00ff66" stroke-width="16"/>
  <!-- 🟢 HIGH-VELOCITY NEON MATRIX INNER GRID -->
  <rect x="32" y="32" width="448" height="448" rx="85" fill="none" stroke="#00ff66" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="16 12"/>
  <!-- ⚡ PRESTIGE MONOLITH DOUBLE "B" MONOGRAM -->
  <g fill="#ffffff" style="font-family:'Courier New', Courier, monospace; font-weight:900; font-size:280px; letter-spacing:-15px;">
